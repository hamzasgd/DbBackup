name: CI

# Type-check and build the server and client, then run the server unit tests,
# on every pull request and on main. CodeQL (codeql.yml) only scans for
# security issues; it does not run tsc, so a type error could reach main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22 # same as the Docker image (node:22-alpine)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server and client (prisma generate, tsc, vite)
        run: npm run build

      - name: Unit tests
        run: npm test
